name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint + type-check + tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check app/ tests/

      - name: Type-check (mypy)
        run: uv run mypy app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true   # warn but don't fail CI on type errors yet

      - name: Run tests
        run: uv run pytest tests/ -q --tb=short
        env:
          APP_ENV: development
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          PROVIDER_MODE: mock

  frontend:
    name: Frontend — lint + type-check + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check (tsc)
        run: npm run build -- --noEmit
        continue-on-error: true   # warn on type errors but don't block

      - name: Build
        run: npm run build
